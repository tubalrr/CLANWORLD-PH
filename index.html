<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLANWORLD PH — 2D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07120f;color:#edf6ef;font-family:Inter,system-ui,sans-serif}button,select{font:inherit}.app{max-width:1280px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px}.eyebrow{color:#7ee09a;font-size:12px;font-weight:800;letter-spacing:.12em}.title{font-size:clamp(25px,4vw,44px);font-weight:900;margin:3px 0}.muted{color:#9eb0a5}.live{border:1px solid #28533d;background:#10261c;padding:10px 14px;border-radius:14px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px}.panel{background:#0d1d17;border:1px solid #20382c;border-radius:20px;padding:14px}.world{padding:8px;overflow:hidden}.map{display:block;width:100%;height:auto;border-radius:15px;background:#58a8c0;image-rendering:auto}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.clan{background:#10251b;border:1px solid #234332;border-radius:16px;padding:12px}.name{font-weight:900}.meter{height:7px;background:#07120f;border-radius:9px;overflow:hidden;margin:8px 0}.fill{height:100%;background:#77d994}.stats{font-size:12px;color:#afc0b5;line-height:1.7}.side{display:flex;flex-direction:column;gap:12px}.control{display:flex;gap:8px;flex-wrap:wrap}.control button,.control select{border:1px solid #2b4939;background:#13271f;color:#edf6ef;border-radius:12px;padding:10px 12px;cursor:pointer}.control button:hover{border-color:#77d994}.events{height:330px;overflow:auto;display:flex;flex-direction:column;gap:7px}.event{background:#13251e;border-radius:11px;padding:9px;font-size:12px}.giftGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.gift{width:100%}.small,.status{font-size:12px}.leader{color:#f6d67e}.legend{font-size:12px;color:#a9bdb0;margin-top:8px}@media(max-width:850px){.layout{grid-template-columns:1fr}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><div class="eyebrow">🔴 LIVE 2D SIMULATION</div><div class="title">CLANWORLD PH</div><div class="muted">Build. Unite. Conquer.</div></div><div class="live">👀 <b id="viewers">1,284</b> viewers</div></header>
<div class="layout"><main>
<section class="panel world"><canvas id="map" class="map" width="900" height="620"></canvas><div class="legend">🌊 Water · 🟩 Grassland · 🌲 Forest · ⛰️ Mountain · 🟡 Village · ● Clan units · Colored tiles = territory</div></section>
<div class="cards" id="cards"></div></main>
<aside class="side">
<section class="panel"><b>🎁 Clan Gifts</b><p class="small muted">Contribution determines the clan leader. Member cap: 400.</p><select id="clan" style="width:100%;margin-bottom:8px"><option value="0">Luzon</option><option value="1">Visayas</option><option value="2">Mindanao</option></select><div class="giftGrid"><button class="control gift" data-add="1">🌹 +1</button><button class="control gift" data-add="3">🎁 +3</button><button class="control gift" data-add="10">💎 +10</button><button class="control gift" data-add="25">🏰 +25</button><button class="control gift" data-add="50">🐉 +50</button><button class="control gift" data-add="100">👑 +100</button></div></section>
<section class="panel"><div class="control"><button id="start">▶ Start</button><button id="event">⚡ Event</button><button id="reset">↺ Reset</button></div><div class="status muted" id="status">World paused.</div></section>
<section class="panel"><b>📜 Live Event Feed</b><div class="events" id="events"></div></section>
</aside></div></div>
<script>
const canvas=document.getElementById('map'),ctx=canvas.getContext('2d'),W=90,H=62,S=10;
const names=['Luzon','Visayas','Mindanao'],emojis=['🟢','🔵','🟠'],colors=['#55c77a','#55aee0','#e5a052'];
let grid=[],clans=names.map(function(name){return {name:name,members:0,points:0,villages:1,territory:0,leader:'No Leader'}}),units=[],villages=[],running=false,timer=null,viewers=1284;
const $=function(id){return document.getElementById(id)};
function rnd(x,y){let n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)}
function noise(x,y){let a=rnd(x,y),b=rnd(x+1,y),c=rnd(x,y+1),d=rnd(x+1,y+1),fx=x-Math.floor(x),fy=y-Math.floor(y),u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function landCells(){let a=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(grid[y][x].land)a.push({x:x,y:y});return a}
function nearestLand(x,y){let best=null,bd=999;for(const c of landCells()){let d=(c.x-x)*(c.x-x)+(c.y-y)*(c.y-y);if(d<bd){bd=d;best=c}}return best}
function paintTerritories(){for(const c of grid.flat())c.owner=-1;const centers=[{x:25,y:18},{x:46,y:36},{x:67,y:48}];centers.forEach(function(p,i){for(let y=Math.max(0,p.y-15);y<Math.min(H,p.y+15);y++)for(let x=Math.max(0,p.x-18);x<Math.min(W,p.x+18);x++){let d=Math.pow((x-p.x)/18,2)+Math.pow((y-p.y)/15,2);if(d<1&&grid[y][x].land&&noise(x/3+i,y/3)>.35)grid[y][x].owner=i}})}
function makeWorld(){grid=Array.from({length:H},function(_,y){return Array.from({length:W},function(_,x){let n=noise(x/7,y/7)*.55+noise(x/16+5,y/16+3)*.45;let edge=Math.min(x/W,(W-x)/W,y/H,(H-y)/H);let land=n>.43&&edge>.015;return {land:land,type:land?'grass':'water',owner:-1}})});for(let pass=0;pass<2;pass++)for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){let c=grid[y][x],near=0;for(let yy=-1;yy<=1;yy++)for(let xx=-1;xx<=1;xx++)near+=grid[y+yy][x+xx].land?1:0;if(near>=5)c.land=true;else if(near<=2)c.land=false;c.type=c.land?'grass':'water'}for(let y=2;y<H-2;y++)for(let x=2;x<W-2;x++){let c=grid[y][x];if(!c.land)continue;let n=noise(x/4+20,y/4+11);if(n>.76)c.type='mountain';else if(n>.59)c.type='forest'}paintTerritories();placeVillages();units=[];for(let i=0;i<3;i++)for(let j=0;j<3;j++)addUnit(i)}
function placeVillages(){villages=[];let cells=landCells();for(let i=0;i<18;i++){let a=cells[Math.floor(Math.random()*cells.length)];if(a)villages.push({x:a.x,y:a.y,owner:grid[a.y][a.x].owner})}}
function addUnit(i){let owned=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(grid[y][x].land&&grid[y][x].owner===i)owned.push({x:x,y:y});let p=owned[Math.floor(Math.random()*owned.length)]||nearestLand(20+i*25,20+i*15);if(p)units.push({x:p.x,y:p.y,clan:i})}
function moveUnits(){units.forEach(function(u){let choices=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){let x=u.x+dx,y=u.y+dy;if(x>=0&&x<W&&y>=0&&y<H&&grid[y][x].land)choices.push({x:x,y:y})}if(choices.length){let p=choices[Math.floor(Math.random()*choices.length)];u.x=p.x;u.y=p.y}})}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let c=grid[y][x],px=x*S,py=y*S;if(c.type==='water')ctx.fillStyle='#4f9db5';else if(c.type==='mountain')ctx.fillStyle=c.owner<0?'#77796e':colors[c.owner];else if(c.type==='forest')ctx.fillStyle=c.owner<0?'#2f7046':colors[c.owner];else ctx.fillStyle=c.owner<0?'#82a85c':colors[c.owner];ctx.globalAlpha=c.owner>=0?.48:1;ctx.fillRect(px,py,S+.4,S+.4);ctx.globalAlpha=1;if(c.type==='mountain'&&c.land){ctx.fillStyle='#535750';ctx.beginPath();ctx.moveTo(px+1,py+9);ctx.lineTo(px+5,py+2);ctx.lineTo(px+9,py+9);ctx.fill()}if(c.type==='forest'&&c.land){ctx.fillStyle='#1e5334';ctx.beginPath();ctx.moveTo(px+5,py+1);ctx.lineTo(px+1,py+8);ctx.lineTo(px+9,py+8);ctx.fill()}}villages.forEach(function(v){ctx.fillStyle='#f7d27c';ctx.beginPath();ctx.arc(v.x*S+5,v.y*S+5,3,0,7);ctx.fill()});units.forEach(function(u){ctx.fillStyle=colors[u.clan];ctx.beginPath();ctx.arc(u.x*S+5,u.y*S+5,3.5,0,7);ctx.fill();ctx.strokeStyle='#07120f';ctx.lineWidth=1;ctx.stroke()});ctx.fillStyle='#fff';ctx.font='bold 16px system-ui';ctx.fillText('LUZON',25*S,4*S);ctx.fillText('VISAYAS',46*S,34*S);ctx.fillText('MINDANAO',67*S,58*S)}
function log(t){let e=document.createElement('div');e.className='event';e.textContent=t;$('events').prepend(e);while($('events').children.length>20)$('events').lastChild.remove()}
function render(){clans.forEach(function(c,i){c.territory=grid.flat().filter(function(x){return x.owner===i}).length});$('viewers').textContent=viewers.toLocaleString();$('cards').innerHTML=clans.map(function(c,i){return '<article class="clan"><div class="name">'+emojis[i]+' '+c.name+'</div><div class="meter"><div class="fill" style="width:'+c.members/4+'%"></div></div><div class="stats">👥 '+c.members+'/400<br>👑 <span class="leader">'+c.leader+'</span><br>💎 '+c.points.toLocaleString()+' contribution<br>🏘️ '+c.villages+' villages<br>🗺️ '+c.territory+' land tiles</div></article>'}).join('');draw()}
function gift(n){let i=+$('clan').value,c=clans[i],old=c.members;c.members=Math.min(400,c.members+n);c.points+=n*10;c.villages=Math.min(99,c.villages+Math.floor(n/25));c.leader='Top Contributor';let owned=grid.flat().filter(function(x){return x.owner===i});for(let k=0;k<Math.min(n,20)&&owned.length;k++){let p=owned[Math.floor(Math.random()*owned.length)],near=[];for(let y=Math.max(0,p.y-2);y<=Math.min(H-1,p.y+2);y++)for(let x=Math.max(0,p.x-2);x<=Math.min(W-1,p.x+2);x++)if(grid[y][x].land&&grid[y][x].owner<0)near.push(grid[y][x]);if(near.length)near[Math.floor(Math.random()*near.length)].owner=i}log('🎁 '+c.name+' received +'+(c.members-old)+' members and +'+n*10+' contribution.');render()}
function tick(){viewers=Math.max(100,viewers+Math.floor(Math.random()*41)-20);moveUnits();if(Math.random()<.18){let i=Math.floor(Math.random()*3);clans[i].villages++;log('🏘️ '+clans[i].name+' founded a new village.')}if(Math.random()<.15){let i=Math.floor(Math.random()*3);log('🧭 '+names[i]+' explorers moved across the 2D world.')}render()}
document.querySelectorAll('[data-add]').forEach(function(b){b.onclick=function(){gift(+b.dataset.add)}});
$('start').onclick=function(){running=!running;$('start').textContent=running?'⏸ Pause':'▶ Start';$('status').textContent=running?'World is evolving…':'World paused.';if(running){timer=setInterval(tick,1000);log('🔴 2D simulation started. Units are moving.')}else{clearInterval(timer);log('⏸ Simulation paused.')}};
$('event').onclick=function(){let i=Math.floor(Math.random()*3),events=['🤝 formed a trade route','⚔️ entered a border conflict','🌾 discovered fertile land','🧭 sent explorers','🏰 expanded into neutral land'];for(const c of grid.flat())if(c.land&&c.owner<0&&Math.random()<.015)c.owner=i;log(emojis[i]+' '+names[i]+' '+events[Math.floor(Math.random()*events.length)]+'.');render()};
$('reset').onclick=function(){clearInterval(timer);running=false;clans=names.map(function(name){return {name:name,members:0,points:0,villages:1,territory:0,leader:'No Leader'}});viewers=1284;makeWorld();$('start').textContent='▶ Start';$('status').textContent='World paused.';$('events').innerHTML='';log('🌍 Fresh 2D world created.');render()};
makeWorld();log('🌍 2D world created. Three clans are waiting for viewers.');render();
</script></body></html>
