<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLANWORLD PH — 3D World</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06110f;color:#edf6ef;font-family:Inter,system-ui,sans-serif}
.app{width:100%;height:100%;position:relative}.top{position:absolute;z-index:10;left:18px;top:16px;right:18px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.top>*{pointer-events:auto}.eyebrow{color:#7ee09a;font-size:12px;font-weight:800;letter-spacing:.12em}.title{font-size:clamp(25px,4vw,44px);font-weight:900;margin:3px 0;text-shadow:0 3px 18px #0008}.muted{color:#9eb0a5}
.live,.panel{background:#0b1a15dc;border:1px solid #294638;border-radius:18px;box-shadow:0 15px 50px #0007;backdrop-filter:blur(16px)}
.live{padding:10px 14px}.world{position:absolute;inset:0}.map{width:100%;height:100%;display:block;cursor:grab}.map:active{cursor:grabbing}
.side{position:absolute;z-index:10;right:18px;top:100px;width:300px;max-height:calc(100vh - 118px);overflow:auto;display:flex;flex-direction:column;gap:10px}.panel{padding:14px}.control{display:flex;gap:7px;flex-wrap:wrap}.control button,.control select{border:1px solid #2b4939;background:#13271f;color:#edf6ef;border-radius:11px;padding:9px 11px;cursor:pointer}.control button:hover{border-color:#77d994}.giftGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:8px}.gift{width:100%}.events{height:230px;overflow:auto;display:flex;flex-direction:column;gap:7px;margin-top:8px}.event{background:#13251e;border-radius:10px;padding:8px;font-size:12px}.small,.status{font-size:12px}.leader{color:#f6d67e}
.cards{position:absolute;z-index:10;left:18px;bottom:18px;display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:8px;max-width:min(720px,calc(100vw - 36px))}.clan{background:#0b1a15dc;border:1px solid #294638;border-radius:14px;padding:10px;backdrop-filter:blur(12px)}.name{font-weight:900}.meter{height:6px;background:#07120f;border-radius:9px;overflow:hidden;margin:7px 0}.fill{height:100%;background:#77d994}.stats{font-size:11px;color:#afc0b5;line-height:1.55}
.hint{position:absolute;z-index:5;left:50%;bottom:18px;transform:translateX(-50%);padding:8px 12px;border-radius:999px;background:#07120fb8;border:1px solid #ffffff1a;color:#b8c9bf;font-size:12px;pointer-events:none}
@media(max-width:850px){.side{left:10px;right:10px;top:auto;bottom:78px;width:auto;max-height:42vh}.cards{left:10px;bottom:10px;grid-template-columns:1fr 1fr;max-width:calc(100vw - 20px)}.cards .clan:last-child{display:none}.hint{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><div class="eyebrow">🔴 LIVE 3D ISLAND SIMULATION</div><div class="title">CLANWORLD PH</div><div class="muted">Build. Unite. Conquer.</div></div><div class="live">👀 <b id="viewers">1,284</b> viewers</div></header>
<section class="world"><canvas id="map" class="map"></canvas></section>
<div class="hint">🖱 Drag = rotate · + / − or W / S = zoom · 0 = reset</div>
<div class="cards" id="cards"></div>
<aside class="side">
<section class="panel"><b>🎁 Clan Gifts</b><p class="small muted">Contribution determines the clan leader. Member cap: 400.</p>
<select id="clan" style="width:100%;margin:6px 0"><option value="0">Luzon</option><option value="1">Visayas</option><option value="2">Mindanao</option></select>
<div class="giftGrid"><button class="control gift" data-add="1">🌹 +1</button><button class="control gift" data-add="3">🎁 +3</button><button class="control gift" data-add="10">💎 +10</button><button class="control gift" data-add="25">🏰 +25</button><button class="control gift" data-add="50">🐉 +50</button><button class="control gift" data-add="100">👑 +100</button></div></section>
<section class="panel"><div class="control"><button id="start">▶ Start</button><button id="event">⚡ Event</button><button id="disaster">🌋 Disaster</button><button id="reset">↺ Reset</button></div><div class="status muted" id="status">World paused.</div></section>
<section class="panel"><b>📜 Live Event Feed</b><div class="events" id="events"></div></section>
</aside>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const canvas=document.getElementById('map');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight,false);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;

const scene=new THREE.Scene(); scene.background=new THREE.Color(0x071b24); scene.fog=new THREE.Fog(0x071b24,48,155);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,300); camera.position.set(0,36,42);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true; controls.dampingFactor=.055; controls.minDistance=10; controls.maxDistance=80; controls.maxPolarAngle=Math.PI*.46; controls.minPolarAngle=.35; controls.target.set(0,1,0);

scene.add(new THREE.HemisphereLight(0xbbeeff,0x163d2b,2.3));
const fill=new THREE.DirectionalLight(0x9edcff,1.1); fill.position.set(28,18,-25); scene.add(fill);
const sun=new THREE.DirectionalLight(0xfff1cf,3.2); sun.position.set(-20,45,18); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); scene.add(sun);

const ocean=new THREE.Mesh(new THREE.CylinderGeometry(50,50,.65,128),new THREE.MeshStandardMaterial({color:0x075a73,roughness:.55,metalness:.08}));
ocean.position.y=-1.05; ocean.receiveShadow=true; scene.add(ocean);
const oceanRing=new THREE.Mesh(new THREE.RingGeometry(50.1,54,128),new THREE.MeshBasicMaterial({color:0x164f60,side:THREE.DoubleSide}));
oceanRing.rotation.x=-Math.PI/2; oceanRing.position.y=-.66; scene.add(oceanRing);

const names=['Luzon','Visayas','Mindanao'],colors=[0x48c878,0x55aee0,0xe5a052],emojis=['🟢','🔵','🟠'];
let clans=names.map(n=>({name:n,members:0,points:0,villages:1,territory:0,leader:'No Leader'}));
let running=false,timer=null,viewers=1284,worldObjects=[],units=[],villages=[],disaster=null;

const islands=[
 {name:'Luzon',clan:0,x:-8,z:-7,w:13,d:15,seed:4},
 {name:'Palawan',clan:0,x:-18,z:4,w:5,d:13,seed:9},
 {name:'Samar-Leyte',clan:1,x:9,z:-1,w:7,d:9,seed:12},
 {name:'Panay-Negros-Cebu',clan:1,x:1,z:4,w:11,d:6,seed:17},
 {name:'Mindanao',clan:2,x:11,z:11,w:15,d:14,seed:22},
 {name:'Bohol',clan:1,x:2,z:11,w:5,d:4,seed:28},
 {name:'Mindoro',clan:0,x:-4,z:4,w:5,d:8,seed:33}
];

function hash(x,y,s){return Math.abs(Math.sin(x*12.9898+y*78.233+s*37.719)*43758.5453)%1}
function islandPoints(isl){const p=[];for(let i=0;i<22;i++){const a=i/22*Math.PI*2,r=.78+.18*hash(i,isl.seed,isl.seed);p.push(new THREE.Vector2(isl.x+Math.cos(a)*isl.w/2*r,isl.z+Math.sin(a)*isl.d/2*r))}return p}
function makeIsland(isl){
 const shape=islandPoints(isl),s=new THREE.Shape(); s.moveTo(shape[0].x,shape[0].y); shape.slice(1).forEach(p=>s.lineTo(p.x,p.y)); s.closePath();
 const g=new THREE.ExtrudeGeometry(s,{depth:1.2,bevelEnabled:true,bevelSegments:2,bevelSize:.22,bevelThickness:.35,curveSegments:3});
 g.rotateX(-Math.PI/2);
 const m=new THREE.MeshStandardMaterial({color:colors[isl.clan],roughness:.9,metalness:0});
 const mesh=new THREE.Mesh(g,m); mesh.position.y=-.25; mesh.castShadow=true; mesh.receiveShadow=true; scene.add(mesh); worldObjects.push(mesh);
 // layered terrain terraces
 for(let layer=0;layer<3;layer++){
  const scale=1-layer*.16;
  const tg=new THREE.CylinderGeometry(Math.min(isl.w,isl.d)*.23*scale,Math.min(isl.w,isl.d)*.34*scale,.45+layer*.12,10);
  const tm=new THREE.MeshStandardMaterial({color:[0x5e8052,0x75965b,0x93a967][layer],roughness:1});
  const terrain=new THREE.Mesh(tg,tm); terrain.scale.set(1.45,.9,1.15); terrain.position.set(isl.x,.72+layer*.42,isl.z); terrain.castShadow=true; scene.add(terrain); worldObjects.push(terrain);
 }
 // coastline foam
 const coast=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(shape.map(p=>new THREE.Vector3(p.x,.42,p.y))),new THREE.LineBasicMaterial({color:0xc8f2d2,transparent:true,opacity:.55}));
 scene.add(coast); worldObjects.push(coast);
 // central volcano and volcanic cone
 const volcanoHeight=5.5+hash(isl.seed,2,9)*3.5;
 const volcano=new THREE.Mesh(new THREE.ConeGeometry(Math.min(isl.w,isl.d)*.19,volcanoHeight,18),new THREE.MeshStandardMaterial({color:0x39463e,roughness:1}));
 volcano.position.set(isl.x+(hash(isl.seed,4,10)-.5)*isl.w*.18,volcanoHeight/2,isl.z+(hash(isl.seed,5,11)-.5)*isl.d*.18); volcano.castShadow=true; scene.add(volcano); worldObjects.push(volcano);
 const crater=new THREE.Mesh(new THREE.CylinderGeometry(Math.min(isl.w,isl.d)*.075,Math.min(isl.w,isl.d)*.11,.35,18),new THREE.MeshStandardMaterial({color:0x211d18,roughness:1}));
 crater.position.set(volcano.position.x,volcanoHeight+.05,volcano.position.z); scene.add(crater); worldObjects.push(crater);
 // mountains
 for(let i=0;i<Math.max(6,Math.floor(isl.w*1.25));i++){
  const x=isl.x+(hash(i,isl.seed,2)-.5)*isl.w*.62,z=isl.z+(hash(i,isl.seed,3)-.5)*isl.d*.55;
  const h=2.0+hash(i,isl.seed,4)*5.0;
  const mt=new THREE.Mesh(new THREE.ConeGeometry(.65+hash(i,isl.seed,5)*.65,h,7),new THREE.MeshStandardMaterial({color:0x4e6257,roughness:1}));
  mt.position.set(x,h/2,z); mt.castShadow=true; scene.add(mt); worldObjects.push(mt);
 }
 // trees
 for(let i=0;i<Math.floor(isl.w*4.8);i++){
  const x=isl.x+(hash(i,isl.seed,6)-.5)*isl.w*.7,z=isl.z+(hash(i,isl.seed,7)-.5)*isl.d*.65;
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.07,.1,.55,5),new THREE.MeshStandardMaterial({color:0x68472d}));
  trunk.position.set(x,.5,z);
  const leaf=new THREE.Mesh(new THREE.ConeGeometry(.5+hash(i,isl.seed,8)*.35,1.65,7),new THREE.MeshStandardMaterial({color:0x23633a,roughness:1}));
  leaf.position.set(x,1.2,z); leaf.castShadow=true; scene.add(trunk,leaf); worldObjects.push(trunk,leaf);
 }
 // label
 const label=document.createElement('canvas'); label.width=512;label.height=96;const lc=label.getContext('2d');lc.clearRect(0,0,512,96);lc.fillStyle='white';lc.font='900 42px system-ui';lc.textAlign='center';lc.fillText(isl.name.toUpperCase(),256,58);
 const tex=new THREE.CanvasTexture(label);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));sp.scale.set(6,1.1,1);sp.position.set(isl.x,5,isl.z);scene.add(sp);worldObjects.push(sp);
}
function clearWorld(){worldObjects.forEach(o=>scene.remove(o));worldObjects=[];units=[];villages=[]}
function spawn(){
 clearWorld(); islands.forEach(makeIsland);
 islands.forEach((isl,ii)=>{
  for(let j=0;j<5;j++){
   const u=new THREE.Mesh(new THREE.SphereGeometry(.28,12,8),new THREE.MeshStandardMaterial({color:colors[isl.clan],emissive:colors[isl.clan],emissiveIntensity:.12}));
   u.position.set(isl.x+(hash(j,isl.seed,11)-.5)*isl.w*.45,1.5,isl.z+(hash(j,isl.seed,12)-.5)*isl.d*.42);
   u.castShadow=true;u.userData={island:ii,clan:isl.clan,tx:u.position.x,tz:u.position.z};scene.add(u);units.push(u);worldObjects.push(u);
  }
  for(let j=0;j<Math.max(2,Math.floor(isl.w/1.8));j++){
   const hut=new THREE.Group();
   const body=new THREE.Mesh(new THREE.BoxGeometry(.7,.55,.7),new THREE.MeshStandardMaterial({color:0xd7b26b}));
   const roof=new THREE.Mesh(new THREE.ConeGeometry(.55,.55,4),new THREE.MeshStandardMaterial({color:0x874e36}));roof.rotation.y=Math.PI/4;roof.position.y=.55;
   hut.add(body,roof);hut.position.set(isl.x+(hash(j,isl.seed,13)-.5)*isl.w*.55,.75,isl.z+(hash(j,isl.seed,14)-.5)*isl.d*.48);hut.castShadow=true;scene.add(hut);villages.push(hut);worldObjects.push(hut);
  }
 });
}
function createDisaster(type){
 if(disaster?.group){scene.remove(disaster.group);}
 const group=new THREE.Group(); disaster={type,group,life:0};
 if(type==='Earthquake'){
  const ring=new THREE.Mesh(new THREE.RingGeometry(.5,2.2,48),new THREE.MeshBasicMaterial({color:0xffd166,transparent:true,opacity:.85,side:THREE.DoubleSide}));
  ring.rotation.x=-Math.PI/2; ring.position.y=.9; group.add(ring);
 }else if(type==='Typhoon'){
  const cloud=new THREE.Mesh(new THREE.TorusGeometry(3.2,.7,10,48),new THREE.MeshBasicMaterial({color:0x9ca9b8,transparent:true,opacity:.65}));
  cloud.rotation.x=Math.PI/2; cloud.position.set(0,8,0); group.add(cloud);
  const eye=new THREE.Mesh(new THREE.TorusGeometry(1.25,.22,8,32),new THREE.MeshBasicMaterial({color:0xd9e5ef,transparent:true,opacity:.8}));
  eye.rotation.x=Math.PI/2;eye.position.set(0,8.2,0);group.add(eye);
 }else if(type==='Tsunami'){
  const wave=new THREE.Mesh(new THREE.TorusGeometry(4,.45,10,64),new THREE.MeshBasicMaterial({color:0x83e6ff,transparent:true,opacity:.75,side:THREE.DoubleSide}));
  wave.rotation.x=Math.PI/2;wave.position.y=.2;group.add(wave);
 }else if(type==='Volcano'){
  const smoke=new THREE.Mesh(new THREE.SphereGeometry(1.8,16,12),new THREE.MeshBasicMaterial({color:0x34383a,transparent:true,opacity:.72}));
  smoke.position.set(-8,9,-7);group.add(smoke);
  const fire=new THREE.PointLight(0xff5a1f,8,15);fire.position.set(-8,3,-7);group.add(fire);
 }else{
  const fire=new THREE.Mesh(new THREE.ConeGeometry(2.2,.5,20),new THREE.MeshBasicMaterial({color:0xff5a1f,transparent:true,opacity:.8}));
  fire.position.set(10,.5,11);group.add(fire);
 }
 scene.add(group);worldObjects.push(group);
}
function triggerDisaster(){
 const types=['Earthquake','Typhoon','Tsunami','Volcano','Wildfire'];
 const labels=['🌎 EARTHQUAKE','🌀 TYPHOON','🌊 TSUNAMI','🌋 VOLCANIC ERUPTION','🔥 WILDFIRE'];
 const i=Math.floor(Math.random()*types.length);
 createDisaster(types[i]); log(labels[i]+' has struck the world!');
 document.getElementById('status').textContent='⚠️ Disaster: '+types[i];
 setTimeout(()=>{if(disaster?.group){scene.remove(disaster.group);disaster=null;document.getElementById('status').textContent=running?'3D world is evolving…':'World paused.'}},7000);
}
function log(t){const e=document.createElement('div');e.className='event';e.textContent=t;document.getElementById('events').prepend(e);while(document.getElementById('events').children.length>20)document.getElementById('events').lastChild.remove()}
function render(){
 clans.forEach((c,i)=>c.territory=islands.filter(x=>x.clan===i).length);
 document.getElementById('viewers').textContent=viewers.toLocaleString();
 document.getElementById('cards').innerHTML=clans.map((c,i)=>'<article class="clan"><div class="name">'+emojis[i]+' '+c.name+'</div><div class="meter"><div class="fill" style="width:'+c.members/4+'%"></div></div><div class="stats">👥 '+c.members+'/400<br>👑 <span class="leader">'+c.leader+'</span><br>💎 '+c.points.toLocaleString()+' contribution<br>🏘️ '+c.villages+' villages<br>🏝️ '+c.territory+' islands</div></article>').join('');
}
function gift(n){const i=+document.getElementById('clan').value,c=clans[i],old=c.members;c.members=Math.min(400,c.members+n);c.points+=n*10;c.villages=Math.min(99,c.villages+Math.floor(n/25));c.leader='Top Contributor';log('🎁 '+c.name+' received +'+(c.members-old)+' members and +'+n*10+' contribution.');render()}
function tick(){
 viewers=Math.max(100,viewers+Math.floor(Math.random()*41)-20);
 units.forEach(u=>{if(Math.random()<.45){u.userData.tx+=((Math.random()-.5)*1.8);u.userData.tz+=((Math.random()-.5)*1.8)}u.position.x+=(u.userData.tx-u.position.x)*.035;u.position.z+=(u.userData.tz-u.position.z)*.035;u.position.y=1.35+Math.sin(performance.now()*.004+u.id)*.15});
 if(Math.random()<.16){const i=Math.floor(Math.random()*3);clans[i].villages++;log('🏘️ '+clans[i].name+' expanded a village.')}
 render();
}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>gift(+b.dataset.add));
document.getElementById('start').onclick=()=>{running=!running;document.getElementById('start').textContent=running?'⏸ Pause':'▶ Start';document.getElementById('status').textContent=running?'3D world is evolving…':'World paused.';if(running){timer=setInterval(tick,700);log('🔴 Real 3D island simulation started.')}else{clearInterval(timer);log('⏸ Simulation paused.')}};
document.getElementById('disaster').onclick=()=>triggerDisaster();
document.getElementById('event').onclick=()=>{const i=Math.floor(Math.random()*3),e=['🤝 opened a sea trade route','⚔️ border conflict started','🌾 discovered fertile land','🧭 explorers crossed the islands','🏰 expanded a settlement'];log(emojis[i]+' '+names[i]+' '+e[Math.floor(Math.random()*e.length)]+'.');render()};
document.getElementById('reset').onclick=()=>{clearInterval(timer);running=false;clans=names.map(n=>({name:n,members:0,points:0,villages:1,territory:0,leader:'No Leader'}));viewers=1284;camera.position.set(0,36,42);controls.target.set(0,1,0);spawn();document.getElementById('start').textContent='▶ Start';document.getElementById('status').textContent='World paused.';document.getElementById('events').innerHTML='';log('🌏 3D Philippine island world recreated.');render()};

window.addEventListener('keydown',e=>{
 const k=e.key;
 if(['+','=','-','_','w','W','s','S','0'].includes(k)){e.preventDefault();
  if(k==='0'){camera.position.set(0,36,42);controls.target.set(0,1,0)}
  else if(k==='+'||k==='='||k==='w'||k==='W')camera.position.lerp(controls.target,.08);
  else camera.position.lerp(controls.target,-.08);
  controls.update();
 }
});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false)});

spawn();log('🌏 Real WebGL 3D Philippine islands created.');render();
function animate(){requestAnimationFrame(animate);controls.update();if(disaster){disaster.life+=.035;const g=disaster.group;if(disaster.type==='Earthquake'){g.children[0].scale.setScalar(1+Math.sin(disaster.life*7)*.25+disaster.life*.12);g.position.y=Math.sin(disaster.life*35)*.08}else if(disaster.type==='Typhoon'){g.rotation.y+=.025;g.position.x=Math.sin(disaster.life)*8;g.position.z=Math.cos(disaster.life)*5}else if(disaster.type==='Tsunami'){g.children[0].scale.setScalar(1+disaster.life*.55);g.children[0].material.opacity=Math.max(0,.75-disaster.life*.08)}else if(disaster.type==='Volcano'){g.children[0].scale.setScalar(1+Math.sin(disaster.life*2)*.12+disaster.life*.08)}else{g.rotation.y+=.02;g.scale.setScalar(1+Math.sin(disaster.life*8)*.12)} }renderer.render(scene,camera)} animate();
</script>
</body>
</html>
